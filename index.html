<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌸 梦の记事本 | 个人博客</title>
        <link rel="stylesheet" href="css/style.css">

</head>
<body>


    <!-- 樱花飘落画布 -->
    <canvas id="sakura-canvas"></canvas>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- 导航栏 -->
    <div class="app-container">
        <nav class="navbar" id="navbar">
            <a class="nav-brand" onclick="scrollToTop()">
                <span class="brand-icon">🌸</span> 梦の记事本
            </a>
            <ul class="nav-links" id="navLinks">
                <li><a href="#home" class="active" onclick="navigateTo('home'); closeMenu();">🏠 首页</a></li>
                <li><a href="#home" onclick="filterByTag('all'); closeMenu();">📝 全部笔记</a></li>
                <li><a href="#home" onclick="filterByTag('技术'); closeMenu();">💻 技术</a></li>
                <li><a href="#home" onclick="filterByTag('生活'); closeMenu();">🍵 生活</a></li>
                <li><a href="#home" onclick="filterByTag('动漫'); closeMenu();">🎬 动漫</a></li>
            </ul>
            <button class="hamburger" id="hamburger" aria-label="菜单">
                <span></span><span></span><span></span>
            </button>
        </nav>

        <!-- 主布局 -->
        <div class="blog-layout" id="home">
            <!-- 主内容区 -->
            <main class="main-content">
                <div class="section-header">
                    <div class="section-title">
                        <span class="icon">📝</span> 最新笔记
                    </div>
                    <div class="search-box">
                        <span class="search-icon">🔍</span>
                        <input type="text" id="searchInput" placeholder="搜索笔记..." oninput="handleSearch()">
                        <button class="search-clear" id="searchClear" onclick="clearSearch()" title="清除">✕</button>
                    </div>
                </div>
                <div id="articlesContainer">
                    <!-- 文章卡片由JS动态渲染 -->
                </div>
                <div class="empty-state" id="emptyState" style="display:none;">
                    <span class="empty-icon">📭</span>
                    <p>没有找到匹配的笔记呢~ 试试其他关键词吧！</p>
                </div>
            </main>

            <!-- 侧边栏 -->
            <aside class="sidebar">
                <!-- 关于我 -->
                <div class="sidebar-card" style="text-align:center;">
                    <img class="about-avatar" src="images/avatar.jpg" alt="小梦的头像" />
                    <div class="about-name">小梦</div>
                    <div class="about-bio">✨ 喜欢二次元、代码和甜食<br>这里是我的秘密笔记基地~</div>
                    <div class="status-indicator" style="justify-content:center;margin-top:0.7rem;">
                        <span class="status-dot"></span> 在线码字中...
                    </div>
                </div>

                <!-- 标签云 -->
                <div class="sidebar-card">
                    <h4>🏷️ 标签云</h4>
                    <div class="tag-cloud" id="tagCloud">
                        <span class="tag tag-pink" onclick="filterByTag('技术')">技术</span>
                        <span class="tag tag-blue" onclick="filterByTag('前端')">前端</span>
                        <span class="tag tag-purple" onclick="filterByTag('CSS')">CSS</span>
                        <span class="tag tag-mint" onclick="filterByTag('JavaScript')">JavaScript</span>
                        <span class="tag tag-pink" onclick="filterByTag('动漫')">动漫</span>
                        <span class="tag tag-blue" onclick="filterByTag('生活')">生活</span>
                        <span class="tag tag-purple" onclick="filterByTag('推荐')">推荐</span>
                        <span class="tag tag-mint" onclick="filterByTag('教程')">教程</span>
                        <span class="tag tag-pink" onclick="filterByTag('资源')">资源</span>
                        <span class="tag tag-blue" onclick="filterByTag('感悟')">感悟</span>
                        <span class="tag tag-purple" onclick="filterByTag('AI')">AI</span>
                        <span class="tag tag-mint" onclick="filterByTag('工具')">工具</span>
                        <span class="tag tag-pink" onclick="filterByTag('全部')" style="font-weight:700;">🔄 全部</span>
                    </div>
                </div>

                <!-- 最近文章 -->
                <div class="sidebar-card">
                    <h4>📌 最近笔记</h4>
                    <ul class="recent-list" id="recentList">
                        <!-- JS动态填充 -->
                    </ul>
                </div>
            </aside>
        </div>
    </div>

    <!-- 文章详情模态框 -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModalOutside(event)">
        <div class="modal-card" id="modalCard">
            <button class="modal-close" onclick="closeModal()">✕</button>
            <div class="modal-icon" id="modalIcon"></div>
            <h2 id="modalTitle"></h2>
            <div class="modal-meta" id="modalMeta"></div>
            <div class="modal-body" id="modalBody"></div>
            <div class="modal-tags" id="modalTags"></div>
        </div>
    </div>

    <!-- 回到顶部 -->
    <button class="back-to-top" id="backToTop" onclick="scrollToTop()" title="回到顶部">⬆</button>

        <script src="js/articles.js"></script>
    <script src="js/main.js"></script>

</body>
</html>
